; Desktop companion — Guition JC3248W535
; ESP32-S3 (16MB flash, 8MB OPI PSRAM), 3.5" 320x480 IPS, AXS15231B (display QSPI + touch I2C)
;
; Usa pioarduino 54.03.21 (Arduino-ESP32 core 3.2.1), fijado porque "stable" pide PlatformIO Core >=6.2.0.
; Arduino_GFX 1.5+ y ledcAttach necesitan core 3.x.

[env:jc3248w535]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; El USB-C va al USB nativo del S3: Serial = USB CDC (logs + enlace con el pc-agent).
; Si tu placa trae chip USB-UART y no ves nada en el monitor, pon CDC_ON_BOOT=0.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.0
    bblanchon/ArduinoJson@^7.0.4
